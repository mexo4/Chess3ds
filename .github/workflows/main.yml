name: Build Chess3DS v1.5.1

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Host tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore Chess3DS v1.5.1 source
        shell: bash
        run: |
          rm -rf Chess3DS_ONE_UPLOAD_READY
          tar -xzf Chess3DS_v1_5_1_TEXTURE_BUILD_FIX_payload.tar.gz

      - name: Run Chess3DS tests
        working-directory: Chess3DS_ONE_UPLOAD_READY
        run: make -f Makefile.host test

  build:
    name: Nintendo 3DS build
    needs: test
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Restore Chess3DS v1.5.1 source
        shell: bash
        run: |
          rm -rf Chess3DS_ONE_UPLOAD_READY
          tar -xzf Chess3DS_v1_5_1_TEXTURE_BUILD_FIX_payload.tar.gz

      - name: Check tex3ds
        shell: bash
        run: |
          command -v tex3ds
          tex3ds --version

      - name: Build Chess3DS
        working-directory: Chess3DS_ONE_UPLOAD_READY
        run: make -j2

      - name: Try CIA build
        working-directory: Chess3DS_ONE_UPLOAD_READY
        shell: bash
        run: |
          if command -v cxitool >/dev/null 2>&1 && command -v makerom >/dev/null 2>&1; then
            make cia || echo "CIA unavailable; keeping the valid 3DSX build."
          else
            echo "CIA tools unavailable; skipping CIA."
          fi

      - name: Prepare artifact
        working-directory: Chess3DS_ONE_UPLOAD_READY
        shell: bash
        run: |
          rm -rf artifact
          mkdir -p artifact

          cp Chess3DS.3dsx artifact/

          if [ -f Chess3DS.smdh ]; then
            cp Chess3DS.smdh artifact/
          fi

          if [ -f Chess3DS.cia ]; then
            cp Chess3DS.cia artifact/
          fi

          cp README.md LICENSE SOURCE.md THIRD_PARTY.md artifact/

      - name: Upload playable build
        uses: actions/upload-artifact@v4
        with:
          name: Chess3DS-v1.5.1
          path: Chess3DS_ONE_UPLOAD_READY/artifact/
          if-no-files-found: errorDY/artifact/
          if-no-files-found: error
